<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#163b31">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dosya 2">
<style>
:root{color-scheme:dark;--bg:#0f1412;--card:#171d1a;--card2:#1d2421;--line:#303a35;--text:#f2f6f4;--muted:#9ba7a1;--accent:#2d765e;--accent2:#3f9b7c;--danger:#b94b4b;--warn:#b88732}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100%}button,input,select,textarea{font:inherit}.hidden{display:none!important}.screen{min-height:100dvh}.center-screen{display:flex;align-items:center;justify-content:center;padding:22px}.auth-card{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 18px 50px #0008}.logo{width:78px;height:78px;border-radius:24px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(145deg,#255f4c,#173c31);font-size:28px;font-weight:900}.auth-card h1{text-align:center;margin:0;font-size:30px}.auth-card .sub{text-align:center;color:var(--muted);margin:6px 0 24px}.field{margin:0 0 12px}.field label{display:block;color:#c8d2cd;font-size:13px;font-weight:700;margin:0 0 6px}.field input,.field select,.field textarea,.search{width:100%;background:#101513;border:1px solid #39443f;color:var(--text);border-radius:12px;padding:12px 13px;outline:none}.field textarea{resize:vertical;min-height:90px}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--accent2);box-shadow:0 0 0 3px #3f9b7c22}.btn{border:0;border-radius:12px;padding:12px 14px;color:#fff;background:var(--accent);font-weight:800;cursor:pointer}.btn:active{transform:translateY(1px)}.btn.secondary{background:#28322e}.btn.danger{background:#7f3434}.btn.full{width:100%}.note{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}.errorbox{background:#3a1d1d;color:#ffc7c7;border:1px solid #703636;padding:10px 12px;border-radius:11px;margin:10px 0}.app{padding-bottom:78px}.topbar{position:sticky;top:0;z-index:20;background:#101613ee;backdrop-filter:blur(14px);border-bottom:1px solid #252e2a;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;min-height:62px}.who{font-weight:850;font-size:17px}.session{font-size:12px;color:var(--muted);margin-top:3px}.content{padding:14px;max-width:900px;margin:0 auto}.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:70px;background:#141a17f5;border-top:1px solid #303934;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}.navbtn{border:0;background:transparent;color:#94a19b;font-size:12px;font-weight:700}.navbtn.active{color:#76c9aa}.navicon{display:block;font-size:22px;margin-bottom:3px}.page-title{font-size:24px;font-weight:900;margin:4px 0 12px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.toolbar .search{flex:1}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;margin:9px 0}.record{display:grid;grid-template-columns:42px 1fr auto;gap:11px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#285f4e;font-weight:900}.record-title{font-weight:850}.record-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.3}.menu{position:relative}.dots{width:36px;height:36px;border:0;border-radius:10px;background:#222a26;color:#fff;font-size:21px}.popup{position:absolute;right:0;top:40px;background:#242c28;border:1px solid #3a443f;border-radius:12px;min-width:210px;box-shadow:0 15px 38px #000a;overflow:hidden;z-index:50}.popup button{display:block;width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:12px}.popup button:hover{background:#303a35}.empty{text-align:center;color:var(--muted);padding:38px 10px}.section-title{font-size:16px;font-weight:900;margin:0 0 12px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #3a4741;background:#151b18;color:#dfe6e2;border-radius:999px;padding:8px 10px;font-size:12px}.chip.on{background:#295f4f;border-color:#4ba788;color:white}.chip.locked{opacity:.75}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.speed-info{padding:9px 10px;border-radius:10px;background:#10271f;color:#9ce2c7;font-weight:800;margin-top:8px}.actions{display:grid;gap:8px;margin:12px 0 30px}.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px}.penalty-code{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:#2a5e4e;font-weight:900}.penalty-title{font-weight:750}.penalty-sub{font-size:12px;color:var(--muted);margin-top:4px}.settings-card{display:flex;gap:12px;align-items:flex-start}.settings-icon{font-size:24px}.install-tip{background:#18231f;border-color:#365447}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#28312d;color:#fff;border:1px solid #46534d;border-radius:12px;padding:11px 14px;z-index:100;max-width:90%;box-shadow:0 12px 30px #0008}.modal{position:fixed;inset:0;z-index:70;background:#000b;display:flex;align-items:flex-end;justify-content:center}.modalbox{width:min(760px,100%);max-height:92dvh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;border:1px solid #344039;padding:15px 12px calc(18px + env(safe-area-inset-bottom))}.modalhead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-15px;background:var(--bg);z-index:3;padding:10px 2px;border-bottom:1px solid #27312d}.modalhead h2{margin:0;font-size:21px}.closebtn{border:0;background:#252e2a;color:#fff;border-radius:10px;padding:8px 11px}.req:after{content:' *';color:#e48989}@media(min-width:700px){.bottomnav{left:50%;transform:translateX(-50%);max-width:700px;border-left:1px solid #303934;border-right:1px solid #303934}.modal{align-items:center}.modalbox{border-radius:22px;max-height:90dvh}.content{padding:20px}}

</style>
<title>Dosya 2 Mobil</title>
</head>
<body>
<div id="loginScreen" class="screen center-screen">
  <div class="auth-card">
    <div class="logo">D2</div>
    <h1>DOSYA 2</h1><div class="sub">Mobil Polis İş Programı</div>
    <div id="loginError" class="errorbox hidden"></div>
    <div class="field"><label>Kullanıcı Adı</label><input id="loginUser" autocomplete="username" autocapitalize="none"></div>
    <div class="field"><label>Şifre</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <button id="loginBtn" class="btn full">Giriş Yap</button>
    <div class="note">Uygulama kurulduktan sonra internet olmadan da çalışır.</div>
  </div>
</div>
<div id="nameScreen" class="screen center-screen hidden">
  <div class="auth-card">
    <div class="logo">D2</div><h1 style="font-size:24px">Personel Bilgisi</h1><div class="sub">Oturumda görünecek adınızı yazın.</div>
    <div class="field"><label>Ad Soyad</label><input id="personName" autocomplete="name" autocapitalize="words" placeholder="Örn. Mehmet Özgür"></div>
    <button id="nameBtn" class="btn full">Devam Et</button>
  </div>
</div>
<div id="appScreen" class="screen app hidden">
  <header class="topbar"><div><div id="who" class="who"></div><div id="session" class="session">Oturum: 00:00:00</div></div></header>
  <main id="page" class="content"></main>
  <nav class="bottomnav">
    <button class="navbtn active" data-tab="records"><span class="navicon">📄</span>Dosya 2</button>
    <button class="navbtn" data-tab="archive"><span class="navicon">🗃️</span>Arşiv</button>
    <button class="navbtn" data-tab="penalty"><span class="navicon">📋</span>Ceza</button>
    <button class="navbtn" data-tab="settings"><span class="navicon">⚙️</span>Ayarlar</button>
  </nav>
</div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Yeni Dosya 2</h2><button id="modalClose" class="closebtn">Kapat</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script>
'use strict';

const CREDS = [
  {u:'dosya2', p:'dosya2'},
  {u:'gypm', p:'trafik'}
];

// Discord webhook endpoints configured from the desktop version discussion.
const WEBHOOKS = {archive:'',loginOk:'',loginFail:'',logout:'',session:'',created:''};

const crimes = [
  ['seyrusefer','Seyrüsefersiz','020'],
  ['muayene','Muayenesiz','023'],
  ['isik','Yetersiz Işık','036'],
  ['kemer','Emniyet Kemersiz','072'],
  ['ehliyetYaninda','Sürüş Ehliyeti Yanında Değil','032'],
  ['kktcEhliyetsiz',"KKTC'den Sürüş Ehliyetsiz",'031'],
  ['hitam','Hitam Bulmuş Ehliyet','158'],
  ['surat','Sürat','001 / 002 / 161'],
  ['tehlikeli','Tehlikeli Sürüş','003'],
  ['sigorta','Sigortasız','114'],
  ['bIsletme','B İşletme İzinsiz','128'],
  ['telefon','Cep Telefonu','176'],
  ['mania','Mania','046'],
  ['ciftSari','Çift Sarı','049'],
  ['kaldirim','Kaldırıma Park','090']
];
const crimeMap = Object.fromEntries(crimes.map(x=>[x[0],x]));

let state = {
  loginUser:'', personName:'', startedAt:0, timer:null, tab:'records',
  records:[], penaltyRows:[], editId:null, selected:new Set()
};

const $ = sel => document.querySelector(sel);
const $$ = sel => [...document.querySelectorAll(sel)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':'&quot;',"'":"&#39;"}[c]));
const nowTR = () => new Date().toLocaleString('tr-TR',{hour12:false});
const pad = n => String(n).padStart(2,'0');
function dur(ms){ const s=Math.floor(ms/1000); return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.remove('hidden'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.add('hidden'),2600); }

// --- IndexedDB ---------------------------------------------------------------
const DBNAME='dosya2_mobile_pwa', DBVER=1, STORE='records';
function openDb(){ return new Promise((resolve,reject)=>{ const r=indexedDB.open(DBNAME,DBVER); r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:'id',autoIncrement:true}); }; r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error); }); }
async function dbAll(){ const db=await openDb(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readonly'); const rq=tx.objectStore(STORE).getAll(); rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>rej(rq.error); }); }
async function dbPut(obj){ const db=await openDb(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readwrite'); const st=tx.objectStore(STORE); const rq=obj.id?st.put(obj):st.add(obj); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function dbDelete(id){ const db=await openDb(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readwrite'); const rq=tx.objectStore(STORE).delete(id); rq.onsuccess=()=>res(); rq.onerror=()=>rej(rq.error); }); }

// --- Log ---------------------------------------------------------------------
function deviceLabel(){ const ua=navigator.userAgent; if(/iPhone/i.test(ua)) return 'iPhone'; if(/iPad/i.test(ua)) return 'iPad'; if(/Android/i.test(ua)) return 'Android'; return navigator.platform || 'Web cihazı'; }
async function publicIp(){ try{ const c=new AbortController(); setTimeout(()=>c.abort(),2200); const r=await fetch('https://api.ipify.org?format=json',{signal:c.signal,cache:'no-store'}); if(!r.ok) return 'Alınamadı'; const j=await r.json(); return j.ip||'Alınamadı'; }catch{return 'Alınamadı';} }
async function sendLog(url,title,lines){ if(!url || !navigator.onLine) return; try{ const ip=await publicIp(); const desc=[...lines,`Cihaz: ${deviceLabel()}`,`Genel IP: ${ip}`,`Tarih / Saat: ${nowTR()}`].join('\n'); await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'Dosya 2 Mobil',embeds:[{title,description:desc}]})}); }catch(_){} }

// --- Auth --------------------------------------------------------------------
async function doLogin(){
  const u=$('#loginUser').value.trim().toLowerCase(), p=$('#loginPass').value;
  $('#loginError').classList.add('hidden');
  if(!CREDS.some(x=>x.u===u && x.p===p)){
    $('#loginError').textContent='Kullanıcı adı veya şifre hatalı.'; $('#loginError').classList.remove('hidden');
    sendLog(WEBHOOKS.loginFail,'⚠️ BAŞARISIZ GİRİŞ',[`Kullanıcı Adı: ${u||'(boş)'}`]); return;
  }
  state.loginUser=u;
  $('#loginScreen').classList.add('hidden'); $('#nameScreen').classList.remove('hidden'); setTimeout(()=>$('#personName').focus(),50);
}
async function finishName(){
  const n=$('#personName').value.trim(); if(n.length<3){toast('Ad Soyad gir.');return;}
  state.personName=n; state.startedAt=Date.now();
  $('#nameScreen').classList.add('hidden'); $('#appScreen').classList.remove('hidden'); $('#who').textContent=n;
  state.timer=setInterval(()=>$('#session').textContent='Oturum: '+dur(Date.now()-state.startedAt),1000);
  sendLog(WEBHOOKS.loginOk,'🔐 BAŞARILI GİRİŞ',[`Personel: ${n}`,`Giriş Kullanıcısı: ${state.loginUser}`]);
  await refreshRecords(); await loadPenalty(); renderPage();
}
async function logout(){
  const elapsed=Date.now()-state.startedAt;
  await Promise.allSettled([
    sendLog(WEBHOOKS.logout,'🚪 ÇIKIŞ YAPILDI',[`Personel: ${state.personName}`]),
    sendLog(WEBHOOKS.session,'⏱️ OTURUM SÜRESİ',[`Personel: ${state.personName}`,`Süre: ${dur(elapsed)}`])
  ]);
  clearInterval(state.timer); location.reload();
}

// --- Main UI -----------------------------------------------------------------
async function refreshRecords(){ state.records=(await dbAll()).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)); }
function setTab(tab){ state.tab=tab; $$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab)); renderPage(); }
function renderPage(){ if(state.tab==='records'||state.tab==='archive') renderRecords(state.tab==='archive'); else if(state.tab==='penalty') renderPenalty(); else renderSettings(); }
function recordCrimeNames(r){ return (r.crimeIds||[]).map(id=>{ if(id==='surat') return speedLabel(r); return crimeMap[id]?.[1]||id; }); }
function speedDiff(r){ const a=Number(r.speedLimit),b=Number(r.speedDetected); return Number.isFinite(a)&&Number.isFinite(b)?b-a:0; }
function speedCode(r){ const d=speedDiff(r); if(d<=0)return ''; if(d<=20)return '001'; if(d<=40)return '002'; return '161 + 003'; }
function speedLabel(r){ const d=speedDiff(r); return d>0?`Sürat +${d} (${speedCode(r)})`:'Sürat'; }
function renderRecords(archived){
  const page=$('#page'); const title=archived?'Yapılan Dosya 2’ler':'Aktif Kayıtlar';
  page.innerHTML=`<div class="row-between"><div class="page-title">${title}</div>${archived?'':'<button id="newBtn" class="btn">+ Yeni Kişi</button>'}</div><div class="toolbar"><input id="recordSearch" class="search" placeholder="Ad, plaka veya olay yeri ara..."></div><div id="recordList"></div>`;
  if(!archived) $('#newBtn').onclick=()=>openEditor();
  $('#recordSearch').oninput=()=>paintRecordList(archived,$('#recordSearch').value);
  paintRecordList(archived,'');
}
function paintRecordList(archived,q){
  q=q.toLowerCase().trim(); const rows=state.records.filter(r=>!!r.archived===archived && (!q || [r.adSoyad,r.plaka,r.olayYeri,...recordCrimeNames(r)].join(' ').toLowerCase().includes(q)));
  const root=$('#recordList'); if(!rows.length){root.innerHTML=`<div class="empty">${archived?'Arşiv boş.':'Aktif kayıt yok.'}</div>`;return;}
  root.innerHTML=rows.map(r=>`<div class="card record" data-id="${r.id}"><div class="avatar">${esc((r.adSoyad||'?').trim().charAt(0).toUpperCase()||'?')}</div><div class="record-main"><div class="record-title">${esc(r.adSoyad||'Adsız Kayıt')}</div><div class="record-sub">${esc([r.plaka,...recordCrimeNames(r)].filter(Boolean).join('  |  '))}</div></div><div class="menu"><button class="dots">⋯</button><div class="popup hidden"><button data-act="open">Aç / Düzenle</button><button data-act="${archived?'restore':'archive'}">${archived?'Aktif Kayıtlara Geri Al':'Yapılan Dosya 2’lere Taşı'}</button><button data-act="delete">Sil</button></div></div></div>`).join('');
  $$('#recordList .record').forEach(card=>{ const id=Number(card.dataset.id), r=state.records.find(x=>x.id===id); card.querySelector('.record-main').onclick=()=>openEditor(r); const dots=card.querySelector('.dots'), pop=card.querySelector('.popup'); dots.onclick=e=>{e.stopPropagation(); $$('.popup').forEach(x=>x!==pop&&x.classList.add('hidden'));pop.classList.toggle('hidden');}; pop.querySelectorAll('button').forEach(b=>b.onclick=async()=>{const a=b.dataset.act;pop.classList.add('hidden'); if(a==='open')openEditor(r); if(a==='archive'){r.archived=true;r.updatedAt=Date.now();await dbPut(r);await refreshRecords();sendLog(WEBHOOKS.archive,'📦 ARŞİVE TAŞINDI',[`Personel: ${state.personName}`]);renderPage();} if(a==='restore'){r.archived=false;r.updatedAt=Date.now();await dbPut(r);await refreshRecords();renderPage();} if(a==='delete'){if(confirm(`${r.adSoyad||'Bu'} kaydı kalıcı olarak silinsin mi?`)){await dbDelete(r.id);await refreshRecords();renderPage();}} }); });
}

// --- Editor ------------------------------------------------------------------
const formFields=[
  ['adSoyad','Ad Soyad',true],['cinsiyet','Cinsiyet',true,'select'],['kimlikNo','Kimlik No'],['dogumYeri','Doğum Yeri'],['dogumTarihi','Doğum Tarihi'],['anne','Anne Adı'],['baba','Baba Adı'],['meslek','Meslek'],['adres','Şimdiki İkametgahı',true],
  ['plaka','Plaka',true],['sucTarihi','Suç Tarihi',true],['saat','Saat'],['olayYeri','Olay Yeri',true],['istikamet','İstikamet'],['ihbarname','İhbarname No'],
  ['raporMemuru','Raporu Yapan Polis Mensubu',true],['tanik1','1. Tanık'],['tanik2','2. Tanık'],['davaNeticesi','Davanın Neticesi'],['ozet','Raporun Özeti',false,'textarea']
];
function todayTR(){ const d=new Date();return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`; }
function timeTR(){const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function openEditor(r=null){
  state.editId=r?.id||null; state.selected=new Set(r?.crimeIds||[]); applyCrimeRules(r||{});
  $('#modalTitle').textContent=r?'Dosya 2 Düzenle':'Yeni Dosya 2';
  const val=(k,def='')=>esc(r?.[k] ?? def);
  $('#modalBody').innerHTML=`
  <form id="recordForm">
    <div class="card"><div class="section-title">Sanık Bilgileri</div>
      ${inputHtml('adSoyad','Ad Soyad',val('adSoyad'),true)}
      <div class="field"><label class="req">Cinsiyet</label><select id="f_cinsiyet"><option value="">Seçiniz...</option><option ${r?.cinsiyet==='Erkek'?'selected':''}>Erkek</option><option ${r?.cinsiyet==='Kadın'?'selected':''}>Kadın</option></select></div>
      ${inputHtml('kimlikNo','Kimlik No',val('kimlikNo'))}${inputHtml('dogumYeri','Doğum Yeri',val('dogumYeri'))}${inputHtml('dogumTarihi','Doğum Tarihi',val('dogumTarihi'))}${inputHtml('anne','Anne Adı',val('anne'))}${inputHtml('baba','Baba Adı',val('baba'))}${inputHtml('meslek','Meslek',val('meslek'))}${inputHtml('adres','Şimdiki İkametgahı',val('adres'),true)}
    </div>
    <div class="card"><div class="section-title">Olay</div>
      ${inputHtml('plaka','Plaka',val('plaka'),true)}${inputHtml('sucTarihi','Suç Tarihi',val('sucTarihi',todayTR()),true)}${inputHtml('saat','Saat',val('saat',timeTR()))}${inputHtml('olayYeri','Olay Yeri',val('olayYeri'),true)}${inputHtml('istikamet','İstikamet',val('istikamet'))}${inputHtml('ihbarname','İhbarname No',val('ihbarname'))}
    </div>
    <div class="card"><div class="section-title">Suçlar</div><div id="crimeChips" class="chips"></div><div id="autoRule" class="note" style="text-align:left"></div><div id="speedFields"></div></div>
    <div class="card"><div class="section-title">Polis / Tanık</div>${inputHtml('raporMemuru','Raporu Yapan Polis Mensubu',val('raporMemuru'),true)}${inputHtml('tanik1','1. Tanık',val('tanik1'))}${inputHtml('tanik2','2. Tanık',val('tanik2'))}</div>
    <div class="card"><div class="section-title">Rapor</div>${inputHtml('davaNeticesi','Davanın Neticesi',val('davaNeticesi'))}${inputHtml('ozet','Raporun Özeti',val('ozet'),false,true)}</div>
    <div id="formErr" class="errorbox hidden"></div>
    <div class="actions"><button type="button" id="saveRecord" class="btn">Kaydet</button><button type="button" id="createDocx" class="btn secondary">Word Oluştur / Telefona Kaydet</button></div>
  </form>`;
  renderCrimeChips(r||{});
  $('#saveRecord').onclick=()=>saveEditor(false);
  $('#createDocx').onclick=()=>saveEditor(true);
  $('#modal').classList.remove('hidden');
}
function inputHtml(k,label,value,req=false,textarea=false){ return `<div class="field"><label class="${req?'req':''}">${label}</label>${textarea?`<textarea id="f_${k}">${value}</textarea>`:`<input id="f_${k}" value="${value}">`}</div>`; }
function applyCrimeRules(r){ if(state.selected.has('muayene')) state.selected.add('seyrusefer'); const lim=Number(r.speedLimit||$('#f_speedLimit')?.value),det=Number(r.speedDetected||$('#f_speedDetected')?.value); if(state.selected.has('surat') && det-lim>=41) state.selected.add('tehlikeli'); }
function renderCrimeChips(r={}){
  const root=$('#crimeChips'); if(!root)return; root.innerHTML=crimes.map(c=>`<button type="button" class="chip ${state.selected.has(c[0])?'on':''} ${(c[0]==='seyrusefer'&&state.selected.has('muayene'))||(c[0]==='tehlikeli'&&state.selected.has('surat')&&speedDiff({speedLimit:$('#f_speedLimit')?.value||r.speedLimit,speedDetected:$('#f_speedDetected')?.value||r.speedDetected})>=41)?'locked':''}" data-id="${c[0]}">${esc(c[1])} ${esc(c[2])}</button>`).join('');
